<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCKiK - System Rozliczania Delegacji</title>
    <style>
        :root {
            --primary-color: #c0392b;
            --primary-hover: #a93226;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dcdde1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        header p {
            color: #666;
            margin-top: 0;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        h2 {
            font-size: 1.25rem;
            color: var(--primary-color);
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="datetime-local"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: vertical;
            height: 90px;
        }

        .inline-add {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button.secondary {
            background-color: #7f8c8d;
        }
        button.secondary:hover {
            background-color: #616a6b;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #fafafa;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        .employee-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #fff;
            padding: 10px;
            border: 1px solid #e1e1e1;
            border-radius: 4px;
            gap: 10px;
        }

        .employee-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-input-container {
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .file-input-container input[type="file"] {
            font-size: 12px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            margin-top: 10px;
        }

        .results-container, .history-container {
            display: none;
        }

        .email-preview {
            background: #fff;
            border: 1px solid var(--border-color);
            border-left: 5px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .email-header {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
            border-bottom: 1px dashed var(--border-color);
            padding-bottom: 5px;
        }

        .email-body {
            white-space: pre-wrap;
            font-family: monospace;
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
        }

        .actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        
        .badge {
            background: #e1f5fe;
            color: #0288d1;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 10px;
        }

        .history-table th, .history-table td {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            text-align: left;
        }

        .history-table th {
            background-color: #f1f2f6;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .nav-tabs button {
            flex: 1;
            background: #e4e7eb;
            color: #333;
        }

        .nav-tabs button.active {
            background: var(--primary-color);
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>RCKiK Delegacje</h1>
        <p>System rozliczania podróży służbowych i zarządzania protokołami</p>
    </header>

    <div class="nav-tabs">
        <button type="button" id="tabFormBtn" class="active" onclick="switchTab('form')">Nowa Delegacja</button>
        <button type="button" id="tabHistoryBtn" onclick="switchTab('history')">Historia Delegacji</button>
    </div>

    <!-- FORMULARZ DELEGACJI -->
    <div class="card" id="form-card">
        <h2>Nowa Delegacja</h2>
        
        <!-- Lokalizacja -->
        <div class="form-group">
            <label for="locationSelect">Lokalizacja RCKiK:</label>
            <select id="locationSelect"></select>
            <div class="inline-add" style="margin-top: 8px;">
                <input type="text" id="newLocationInput" placeholder="Nowa lokalizacja (np. RCKiK Warszawa)">
                <button type="button" onclick="addLocation()">Dodaj lokalizację</button>
            </div>
        </div>

        <!-- Samochód -->
        <div class="form-group">
            <label for="vehicleSelect">Samochód:</label>
            <select id="vehicleSelect"></select>
            <div class="inline-add" style="margin-top: 8px;">
                <input type="text" id="newVehicleInput" placeholder="Nowy samochód (Marka, Nr rej)">
                <button type="button" onclick="addVehicle()">Dodaj samochód</button>
            </div>
        </div>

        <!-- Pracownicy i Rachunki -->
        <div class="form-group">
            <label>Uczestnicy delegacji (zaznacz osoby i opcjonalnie dodaj rachunek/fakturę):</label>
            <div class="checkbox-group" id="employeesCheckboxGroup"></div>
            
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-top: 10px;">
                <input type="text" id="newEmployeeInput" placeholder="Imię i Nazwisko nowego pracownika">
                <input type="email" id="newEmployeeEmailInput" placeholder="E-mail pracownika">
            </div>
            <button type="button" onclick="addEmployee()" style="margin-top: 8px;">Dodaj pracownika do bazy</button>
        </div>

        <!-- Daty i godziny -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="form-group">
                <label for="departureTime">Data i godzina wyjazdu:</label>
                <input type="datetime-local" id="departureTime">
            </div>
            <div class="form-group">
                <label for="returnTime">Data i godzina powrotu:</label>
                <input type="datetime-local" id="returnTime">
            </div>
        </div>

        <!-- Cel i Praca -->
        <div class="form-group">
            <label for="delegationPurpose">Cel delegacji:</label>
            <input type="text" id="delegationPurpose" placeholder="np. Transport preparatów krwią / Spotkanie robocze">
        </div>

        <div class="form-group">
            <label for="workDescription">Opis wykonanej pracy:</label>
            <textarea id="workDescription" placeholder="Szczegółowy opis wykonanych czynności..."></textarea>
        </div>

        <button type="button" class="btn-submit" onclick="generateProtocols()">Generuj Protokoły dla Uczestników</button>
        
        <div style="text-align: right; margin-top: 15px;">
            <button type="button" class="secondary" onclick="resetToDefaults()" style="font-size: 11px; padding: 5px 10px; background: #e74c3c;">Resetuj słowniki do domyślnych</button>
        </div>
    </div>

    <!-- WYNIKI / WYGENEROWANE E-MAILERE -->
    <div class="card results-container" id="results-card">
        <h2>Wygenerowane Protokoły E-mail (Dla Kierownika)</h2>
        <p style="font-size: 14px; color: #666;">Dla każdego uczestnika wygenerowano osobny protokół. Załączniki (faktury) zostały powiązane z wiadomościami:</p>
        
        <div id="emailsContainer"></div>

        <button type="button" class="secondary" onclick="resetForm()" style="margin-top: 15px;">← Wróć do formularza / Nowa delegacja</button>
    </div>

    <!-- HISTORIA DELEGACJI -->
    <div class="card history-container" id="history-card">
        <h2>Historia Delegacji</h2>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <div>
                <label for="filterEmployee" style="display:inline-block; font-size: 13px; margin-right: 5px;">Filtruj pracownika:</label>
                <select id="filterEmployee" onchange="renderHistory()" style="padding: 5px; font-size: 13px; display:inline-block; width: auto;">
                    <option value="">Wszyscy pracownicy</option>
                </select>
            </div>
            <button type="button" class="secondary" onclick="clearHistory()" style="font-size: 12px; padding: 5px 10px;">Wyczyść historię</button>
        </div>
        <div id="historyTableContainer"></div>
        <button type="button" class="secondary" onclick="switchTab('form')" style="margin-top: 15px;">← Powrót do formularza</button>
    </div>
</div>

<script>
    const defaultData = {
        locations: [
            "RCKiK Łódź", "RCKiK Gdańsk", "RCKiK Kielce", "RCKiK Kalisz", 
            "RCKiK Rzeszów", "RCKiK Olsztyn", "RCKiK Katowice", "RCKiK Białystok", "RCKiK Szczecin"
        ],
        vehicles: [
            "Opel Movano (WU 4395R)", "Renault Master (WU 4724L)"
        ],
        employees: [
            { name: "Bartosz Miller", email: "bartosz.miller@m2mteam.pl" },
            { name: "Marek Kwiecień", email: "bartosz.miller@m2mteam.pl" },
            { name: "Kacper Górka", email: "bartosz.miller@m2mteam.pl" },
            { name: "Kamil Cieżko", email: "bartosz.miller@m2mteam.pl" }
        ],
        history: []
    };

    // Bezpieczne ładowanie i naprawa danych z localStorage
    let appData;
    try {
        const saved = JSON.parse(localStorage.getItem('rckik_app_data'));
        appData = {
            locations: (saved && Array.isArray(saved.locations) && saved.locations.length > 0) ? saved.locations : defaultData.locations,
            vehicles: (saved && Array.isArray(saved.vehicles) && saved.vehicles.length > 0) ? saved.vehicles : defaultData.vehicles,
            employees: (saved && Array.isArray(saved.employees) && saved.employees.length > 0) 
                ? saved.employees.map(e => typeof e === 'string' ? { name: e, email: "bartosz.miller@m2mteam.pl" } : e) 
                : defaultData.employees,
            history: (saved && Array.isArray(saved.history)) ? saved.history : []
        };
    } catch (e) {
        appData = defaultData;
    }

    function saveAppData() {
        localStorage.setItem('rckik_app_data', JSON.stringify(appData));
    }

    function resetToDefaults() {
        if (confirm('Czy na pewno chcesz zresetować lokalizacje, samochody i pracowników do stanu domyślnego? (Historia zostanie zachowana)')) {
            appData.locations = [...defaultData.locations];
            appData.vehicles = [...defaultData.vehicles];
            appData.employees = [...defaultData.employees];
            saveAppData();
            initApp();
            alert('Zresetowano słowniki pomyślnie!');
        }
    }

    function initApp() {
        renderLocations();
        renderVehicles();
        renderEmployees();
        setDefaultDates();
        populateFilterDropdown();
    }

    function setDefaultDates() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const todayStr = `${year}-${month}-${day}`;
        
        document.getElementById('departureTime').value = `${todayStr}T06:00`;
        document.getElementById('returnTime').value = `${todayStr}T14:00`;
    }

    function renderLocations() {
        const select = document.getElementById('locationSelect');
        if (!select) return;
        select.innerHTML = '';
        appData.locations.forEach(loc => {
            const option = document.createElement('option');
            option.value = loc;
            option.textContent = loc;
            select.appendChild(option);
        });
    }

    function renderVehicles() {
        const select = document.getElementById('vehicleSelect');
        if (!select) return;
        select.innerHTML = '';
        appData.vehicles.forEach(veh => {
            const option = document.createElement('option');
            option.value = veh;
            option.textContent = veh;
            select.appendChild(option);
        });
    }

    function renderEmployees() {
        const container = document.getElementById('employeesCheckboxGroup');
        if (!container) return;
        container.innerHTML = '';
        appData.employees.forEach((emp, index) => {
            const row = document.createElement('div');
            row.className = 'employee-row';
            row.innerHTML = `
                <div class="employee-info">
                    <input type="checkbox" name="employeeCheckbox" value="${emp.name}" data-email="${emp.email}" id="emp_${index}" style="width:18px; height:18px; cursor:pointer;">
                    <label for="emp_${index}" style="cursor:pointer; margin:0; font-weight:normal;">
                        <b>${emp.name}</b> <span style="font-size:11px; color:#888;">(${emp.email})</span>
                    </label>
                </div>
                <div class="file-input-container">
                    <label for="file_${index}" style="font-size:12px; margin:0; color:#555;">Rachunek/Faktura:</label>
                    <input type="file" id="file_${index}" data-emp="${emp.name}" accept="image/*,.pdf" style="max-width: 220px;">
                </div>
            `;
            container.appendChild(row);
        });
    }

    function populateFilterDropdown() {
        const filterSelect = document.getElementById('filterEmployee');
        if (!filterSelect) return;
        filterSelect.innerHTML = '<option value="">Wszyscy pracownicy</option>';
        appData.employees.forEach(emp => {
            const option = document.createElement('option');
            option.value = emp.name;
            option.textContent = emp.name;
            filterSelect.appendChild(option);
        });
    }

    function addLocation() {
        const input = document.getElementById('newLocationInput');
        const val = input.value.trim();
        if (!val) { alert('Wpisz nazwę lokalizacji.'); return; }
        if (appData.locations.includes(val)) { alert('Taka lokalizacja już istnieje.'); return; }
        appData.locations.push(val);
        saveAppData();
        renderLocations();
        input.value = '';
        alert('Dodano lokalizację!');
    }

    function addVehicle() {
        const input = document.getElementById('newVehicleInput');
        const val = input.value.trim();
        if (!val) { alert('Wpisz dane samochodu.'); return; }
        if (appData.vehicles.includes(val)) { alert('Taki samochód już istnieje.'); return; }
        appData.vehicles.push(val);
        saveAppData();
        renderVehicles();
        input.value = '';
        alert('Dodano samochód!');
    }

    function addEmployee() {
        const nameInput = document.getElementById('newEmployeeInput');
        const emailInput = document.getElementById('newEmployeeEmailInput');
        const name = nameInput.value.trim();
        const email = emailInput.value.trim() || 'bartosz.miller@m2mteam.pl';

        if (!name) { alert('Wpisz imię i nazwisko pracownika.'); return; }
        if (appData.employees.some(e => e.name === name)) { alert('Taki pracownik już istnieje.'); return; }

        appData.employees.push({ name: name, email: email });
        saveAppData();
        renderEmployees();
        populateFilterDropdown();
        nameInput.value = '';
        emailInput.value = '';
        alert('Dodano pracownika!');
    }

    async function generateProtocols() {
        const location = document.getElementById('locationSelect').value;
        const vehicle = document.getElementById('vehicleSelect').value;
        const departure = document.getElementById('departureTime').value;
        const returnT = document.getElementById('returnTime').value;
        const purpose = document.getElementById('delegationPurpose').value.trim();
        const workDesc = document.getElementById('workDescription').value.trim();

        const checkboxes = document.querySelectorAll('input[name="employeeCheckbox"]:checked');
        if (checkboxes.length === 0) {
            alert('Musisz zaznaczyć przynajmniej jednego uczestnika delegacji!');
            return;
        }

        if (!departure || !returnT) {
            alert('Proszę uzupełnić datę i godzinę wyjazdu oraz powrotu.');
            return;
        }

        const emailsContainer = document.getElementById('emailsContainer');
        emailsContainer.innerHTML = '';

        const delegationRecord = {
            id: Date.now(),
            dateCreated: new Date().toLocaleString(),
            location: location,
            vehicle: vehicle,
            departure: departure.replace('T', ' '),
            return: returnT.replace('T', ' '),
            purpose: purpose || 'Brak',
            participants: []
        };

        for (const cb of checkboxes) {
            const empName = cb.value;
            const empEmail = cb.getAttribute('data-email');
            
            const fileInput = document.querySelector(`input[type="file"][data-emp="${empName}"]`);
            let fileName = 'Brak załącznika';
            if (fileInput && fileInput.files.length > 0) {
                fileName = fileInput.files[0].name;
            }

            const allCheckboxes = Array.from(checkboxes);
            const coParticipants = allCheckboxes.map(c => c.value).filter(n => n !== empName);
            const coParticipantsStr = coParticipants.length > 0 ? coParticipants.join(', ') : 'brak (wyjazd pojedynczy)';

            const emailSubject = `${location} - ${empName}`;
